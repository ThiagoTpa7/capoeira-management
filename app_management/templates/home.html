{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Projeto Capoeira</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsives.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
<nav class="navbar navbar-expand-md navbar-dark bg-dark">

    <div class="container">

        <!-- LOGO -->
        <a class="navbar-brand" href="/">
            Capoeira
        </a>

        <!-- BOTÃO MOBILE -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- MENU -->
        <div class="collapse navbar-collapse"
             id="navbarNav">

            <!-- ESQUERDA -->
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        Início
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/quem-somos/">
                        Quem Somos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/historia-capoeira/">
                        História
                    </a>
                </li>

            </ul>

            <!-- DIREITA -->
            <div class="d-flex flex-column flex-md-row gap-2">

                <a class="btn btn-outline-light"
                   href="/alunos/">

                    Alunos

                </a>

                {% if request.user.is_superuser %}

                <a class="btn btn-outline-light"
                   href="/mensalidades/">

                    Mensalidades

                </a>

                {% endif %}

                {% if request.user.is_authenticated %}

                <a class="btn btn-danger"
                   href="{% url 'logout_user' %}">

                    Sair

                </a>

                {% else %}

                <a class="btn btn-outline-light"
                   href="{% url 'login_user' %}">

                    Login

                </a>

                {% endif %}

            </div>

        </div>

    </div>

</nav>

    <!-- Conteúdo -->
    <div class="container-fluid container-lg mt-4 px-3">
        {% block content %}
        {% endblock %}
    </div>
<script src="{% static 'js/script.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
