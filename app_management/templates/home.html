{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Projeto Capoeira</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <div class="d-flex justify-content-btween">
                <a class="navbar-brand" href="/">Inicio</a>
                <a class="navbar-brand" href="/quem-somos/">Quem somos</a>
                <a class="navbar-brand" href="/historia-capoeira/">Historia da Capoeira</a>
            </div>
            
            

            <div>
                {% if request.user.is_authenticated %}
                    <a class="btn btn-danger" href="{% url 'logout_user' %}">Sair</a>
                {% else %}
                    <a class="btn btn-outline-light" href="{% url 'login_user' %}">Login</a>
                {% endif %}
                <a class="btn btn-outline-light" href="/alunos/">Alunos</a>
                {% if request.user.is_superuser %}
                    <a class="btn btn-outline-light" href="/mensalidades/">Mensalidades</a>
                {% endif %}
                
            </div>
        </div>
    </nav>

    <!-- Conteúdo -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
