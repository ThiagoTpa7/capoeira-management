{% extends 'home.html' %}

{% block content %}

<h1 class="mb-4">Cadastrar Mensalidade</h1>

{% if erro %}
    <div class="alert alert-danger">
        {{ erro }}
    </div>
{% endif %}

<form method="POST" class="card p-4">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Aluno</label>
        <select name="aluno" class="form-select">
            {% for aluno in alunos %}
                <option value="{{ aluno.id }}">{{ aluno.nome }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Valor</label>
        <input type="number" step="0.01" name="valor" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Mês (MM/AAAA)</label>
        <input type="text" name="mes_referencia" class="form-control" placeholder="04/2026">
    </div>

    <button type="submit" class="btn btn-success">Cadastrar</button>
    <a href="/mensalidades/" class="btn btn-secondary">Cancelar</a>
</form>

{% endblock %}
